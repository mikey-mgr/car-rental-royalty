services:
  # Backend Service
  - type: web
    name: apex-car-rental-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx512m -Xms256m
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: apex-car-rental-db
          property: connectionString
      - key: SERVER_PORT
        value: 8080
    healthCheckPath: /actuator/health

databases:
  - name: apex-car-rental-db
    databaseName: car_rental
    user: apex_user
    plan: free
