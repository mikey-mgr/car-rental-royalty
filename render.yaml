services:
  # Backend Service
  - type: web
    name: deroyalty-car-rental-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx512m -Xms256m
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-d8j9eebtqb8s73bucr60-a/car_rental_qnd81?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: apex_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://deroyalty-car-rental-frontend.onrender.com,http://localhost:8583

  # Frontend Web Service (with serve package for Vue Router history mode)
  - type: web
    name: deroyalty-car-rental-frontend
    env: node
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx serve -s dist -l $PORT
    plan: free
    envVars:
      - key: VUE_APP_API_URL
        value: https://deroyalty-car-rental-backend.onrender.com

databases:
  - name: apex-car-rental-db
    databaseName: car_rental
    user: apex_user
    plan: free
