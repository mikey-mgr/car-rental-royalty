services:
  # Backend Service
  - type: web
    name: apex-car-rental-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx512m -Xms256m
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-d7st1rbbc2fs73d3ighg-a:5432/car_rental_qnd8
      - key: SPRING_DATASOURCE_USERNAME
        value: apex_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://apex-car-rental-frontend.onrender.com,http://localhost:8583

  # Frontend Static Site
  - type: web
    name: apex-car-rental-frontend
    env: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VUE_APP_API_URL
        value: https://apex-car-rental-backend.onrender.com

databases:
  - name: apex-car-rental-db
    databaseName: car_rental
    user: apex_user
    plan: free
