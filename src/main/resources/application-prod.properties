# Production Configuration for Render
server.port=${PORT:8080}

# Database Configuration - Set via environment variables
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Session cookie configuration for cross-origin
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Production optimizations
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# CORS Configuration - Update with your frontend URL
# management.endpoints.web.cors.allowed-origins=https://your-frontend-url.onrender.com
management.endpoints.web.cors.allowed-methods=POST, GET, PUT, DELETE, OPTIONS

# Security
spring.security.require-ssl=false

# Actuator for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Bind datasource from environment (Render provides these env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
