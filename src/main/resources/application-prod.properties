# Production Configuration for Render
server.port=${SERVER_PORT:8080}

# Database Configuration - Render provides DATABASE_URL
spring.datasource.url=${DATABASE_URL:jdbc:mariadb://localhost:3306/car_rental}
spring.datasource.username=${DB_USERNAME:adimin}
spring.datasource.password=${DB_PASSWORD:123456$i}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update

# Production optimizations
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# CORS Configuration - Update with your frontend URL
# management.endpoints.web.cors.allowed-origins=https://your-frontend-url.onrender.com
management.endpoints.web.cors.allowed-methods=POST, GET, PUT, DELETE, OPTIONS

# Security
spring.security.require-ssl=false

# Actuator for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
