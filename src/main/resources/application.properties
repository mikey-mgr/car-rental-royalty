# Spring config & Security
server.port=8081

# Management / health
management.endpoints.web.cors.allowed-methods=POST, GET, PUT, UPDATE, DELETE, OPTIONS
management.endpoints.web.exposure.include=health

# JDBC URL, username, password, and driver class name
spring.datasource.url=jdbc:mariadb://localhost:3306/car-rental?createDatabaseIfNotExist=true
# Database credentials must be provided via environment variables
# Example (local dev): set DB_USERNAME=devuser && set DB_PASSWORD=devpass
# In production do NOT store secrets in the repository; use your secret manager.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update

# Local dev session settings
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=3600

# Local dev logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
