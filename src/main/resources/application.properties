#Spring config & Security
server.port=8081
management.endpoints.web.cors.allowed-methods= POST, GET, PUT, UPDATE, DELETE
#spring.security.user.name=javatalent
#spting.security.user.password=javatalent

#JDBC URL, username, password, and driver class name
spring.datasource.url=jdbc:mariadb://localhost:3306/car-rental?createDatabaseIfNotExist=true
# Database credentials must be provided via environment variables
# Example (local dev): set DB_USERNAME=devuser && set DB_PASSWORD=devpass
# In production do NOT store secrets in the repository; use your secret manager.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update

